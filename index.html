<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高鑫車業 G.X. MOTORS | 首頁</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Helvetica Neue", Arial, sans-serif; }
        
        body { 
            background: #14181F;
            color: #F5F2EB; 
            line-height: 1.6; 
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .navbar { 
            position: fixed; top: 0; width: 100%; display: flex; justify-content: space-between; align-items: center; 
            padding: 25px 60px; 
            background-color: rgba(20, 24, 31, 0.75); 
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            z-index: 1000; 
            border-bottom: 1px solid rgba(221, 232, 235, 0.08); 
        }
        
        .logo { font-size: 22px; font-weight: bold; color: #F5F2EB; text-decoration: none; letter-spacing: 4px; }
        
        .menu { display: flex; gap: 40px; }
        .menu a { 
            color: #F5F2EB; text-decoration: none; font-size: 14px; letter-spacing: 2px; 
            position: relative; padding-bottom: 5px; opacity: 0.8;
            transition: all 0.3s ease;
        }
        .menu a:hover, .menu a.active { opacity: 1; color: #DDE8EB; }
        .menu a::after {
            content: ''; position: absolute; bottom: 0; left: 0;
            width: 0%; height: 1px; background-color: #DDE8EB; 
            transition: width 0.3s ease;
        }
        .menu a:hover::after, .menu a.active::after { width: 100%; }
        
        .menu-checkbox { display: none; }
        .hamburger-icon { display: none; color: #F5F2EB; font-size: 28px; cursor: pointer; }

        .hero-section {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 140px 80px 80px 80px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            position: relative;
        }

        /* 影片背景容器設定（自動播放、循環、靜音、淡化處理） */
        .hero-video-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
            background-color: #14181F;
        }

        .hero-video-bg video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.35; /* 影片透明度，襯托文字質感 */
        }

        /* 疊加黑幕漸層，確保文字清晰易讀 */
        .hero-video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(20, 24, 31, 0.92) 0%, rgba(26, 31, 41, 0.85) 50%, rgba(13, 16, 21, 0.95) 100%);
        }

        .hero-content {
            max-width: 600px;
            z-index: 2;
        }

        .hero-tag {
            font-size: 12px;
            letter-spacing: 4px;
            color: #DDE8EB;
            opacity: 0.6;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .hero-title {
            font-size: 48px;
            font-weight: 300;
            letter-spacing: 4px;
            line-height: 1.3;
            margin-bottom: 25px;
            color: #F5F2EB;
        }

        .hero-desc {
            font-size: 15px;
            color: #DDE8EB;
            opacity: 0.75;
            line-height: 1.8;
            margin-bottom: 40px;
            letter-spacing: 1px;
        }

        .explore-btn {
            display: inline-flex;
            align-items: center;
            gap: 15px;
            padding: 16px 35px;
            border: 1px solid rgba(221, 232, 235, 0.3);
            color: #F5F2EB;
            text-decoration: none;
            letter-spacing: 2px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.02);
            transition: all 0.3s ease;
            border-radius: 4px;
        }

        .explore-btn:hover {
            background-color: #DDE8EB;
            border-color: #DDE8EB;
            color: #14181F;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .hero-graphic {
            position: relative;
            width: 500px;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }

        .car-vector {
            width: 100%;
            opacity: 0.85;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
            animation: floatCar 6s ease-in-out infinite;
        }

        @keyframes floatCar {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .footer-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 80px;
            border-top: 1px solid rgba(221, 232, 235, 0.05);
            font-size: 12px;
            letter-spacing: 2px;
            color: #DDE8EB;
            opacity: 0.5;
            z-index: 2;
        }

        /* 右下角懸浮聯絡按鈕選單（包含 LINE 與撥打電話） */
        .contact-menu {
            position: fixed;
            bottom: 30px;
            right: 40px;
            display: flex;
            flex-direction: column-reverse;
            align-items: flex-end;
            gap: 10px;
            z-index: 999;
        }

        .contact-toggle { display: none; }

        .contact-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: #1B3F43;
            color: #DDE8EB;
            padding: 12px 25px;
            border-radius: 30px;
            border: 1px solid rgba(221, 232, 235, 0.2);
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 1px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .contact-btn:hover {
            background-color: #DDE8EB;
            color: #14181F;
            transform: scale(1.05);
        }

        .contact-item {
            background-color: #203B5F;
            color: #F5F2EB;
            padding: 10px 20px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 13px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            opacity: 0;
            visibility: hidden;
            transform: translateY(20px);
            transition: all 0.3s ease;
        }

        .contact-item:hover {
            background-color: #DDE8EB;
            color: #203B5F;
        }

        .contact-toggle:checked ~ .contact-item {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        @media (max-width: 968px) {
            .navbar { padding: 20px 30px; }
            .hamburger-icon { display: block; }
            .menu {
                display: none; flex-direction: column; position: absolute;
                top: 100%; left: 0; width: 100%; background-color: #14181F;
                padding: 20px 0; border-top: 1px solid rgba(221,232,235,0.1);
                text-align: center; gap: 20px;
            }
            .menu-checkbox:checked ~ .menu { display: flex; }
            .hero-section { flex-direction: column; padding: 120px 25px 40px 25px; text-align: center; gap: 40px; }
            .hero-content { max-width: 100%; }
            .explore-btn { margin: 0 auto; }
            .hero-graphic { width: 100%; max-width: 380px; }
            .footer-bar { padding: 20px 30px; flex-direction: column; gap: 10px; text-align: center; }
            .contact-menu { bottom: 20px; right: 20px; }
        }
    </style>
</head>
<body>

    <!-- 背景影片區塊：自動播放、循環、靜音 -->
    <div class="hero-video-bg">
        <video autoplay muted loop playsinline>
            <!-- 提示：您可以將 src 指向您自己的影片檔案路徑，例如：videos/car-bg.mp4 -->
            <source src="videos/car-bg.mp4" type="video/mp4">
        </video>
        <div class="hero-video-overlay"></div>
    </div>

    <nav class="navbar">
        <a href="index.html" class="logo">高鑫車業</a>
        <input type="checkbox" id="menu-toggle" class="menu-checkbox">
        <label for="menu-toggle" class="hamburger-icon">☰</label>
        <div class="menu">
            <a href="index.html" class="active">首頁</a>
            <a href="buy.html">嚴選買車</a>
            <a href="sell.html">線上估車</a>
            <a href="about.html">關於我們</a>
        </div>
    </nav>

    <main class="hero-section">
        <div class="hero-content">
            <div class="hero-tag">Clarity Builds Trust</div>
            <h1 class="hero-title">需求先行，<br>車況為本。</h1>
            <p class="hero-desc">從理解需求到確認車況，讓每一次選擇，都有值得信賴的理由。</p>
            <a href="buy.html" class="explore-btn">
                探索嚴選車款 <span>→</span>
            </a>
        </div>

        <div class="hero-graphic">
            <svg class="car-vector" viewBox="0 0 600 250" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M50 180 C80 140, 150 120, 200 120 C250 120, 300 140, 350 150 C400 160, 480 150, 530 130 C560 118, 580 90, 580 90" stroke="#DDE8EB" stroke-width="2" stroke-opacity="0.4"/>
                <path d="M20 200 L580 200" stroke="#DDE8EB" stroke-width="2" stroke-opacity="0.2"/>
                <path d="M120 180 L180 130 C210 110, 260 95, 340 95 C410 95, 460 120, 490 150 L540 180 Z" fill="#1B3F43" fill-opacity="0.3" stroke="#DDE8EB" stroke-width="2"/>
                <circle cx="170" cy="190" r="28" fill="#14181F" stroke="#DDE8EB" stroke-width="3"/>
                <circle cx="170" cy="190" r="10" fill="#DDE8EB" fill-opacity="0.5"/>
                <circle cx="450" cy="190" r="28" fill="#14181F" stroke="#DDE8EB" stroke-width="3"/>
                <circle cx="450" cy="190" r="10" fill="#DDE8EB" fill-opacity="0.5"/>
                <path d="M220 125 L320 100 L380 150 L200 150 Z" fill="#DDE8EB" fill-opacity="0.08"/>
            </svg>
        </div>
    </main>

    <footer class="footer-bar">
        <div>SCROLL TO EXPLORE ↓</div>
        <div>G.X. MOTORS PROFESSIONAL CAR SERVICE</div>
    </footer>

    <div class="contact-menu">
        <input type="checkbox" id="contact-toggle" class="contact-toggle">
        <label for="contact-toggle" class="contact-btn">💬 聯絡我們</label>
        <a href="https://lin.ee/Zubnbww" target="_blank" class="contact-item">💬 官方 LINE</a>
        <a href="tel:0909361360" class="contact-item">📞 撥打電話</a>
    </div>

</body>
</html>
