<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高鑫車業 | 線上估車</title>

    <style>
        /* 
           === 品牌專屬色票 ===
           深海藍: #203B5F (保留給按鈕或細節)
           深青綠: #1B3F43 (暗色邊框)
           霧灰: #DDE8EB (亮色邊框/標題)
           米白: #F5F2EB (文字)
           炭灰: #2B2F33 (主背景)

        */

        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Helvetica Neue", Arial, sans-serif; }
        
        /* 【修改重點1】網頁主體：改用「炭灰」作為底色，整體視覺更深邃高級 */
        body { background-color: #2B2F33; color: #F5F2EB; line-height: 1.6; padding-top: 80px; }
        
        /* 導覽列：維持深海藍的質感 */
        .navbar { position: fixed; top: 0; width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; background-color: rgba(32, 59, 95, 0.95); z-index: 1000; border-bottom: 1px solid #1B3F43; }
        .logo { font-size: 24px; font-weight: bold; color: #F5F2EB; text-decoration: none; letter-spacing: 2px; }
        
        /* 電腦版選單 */
        .menu { display: flex; gap: 30px; }
        .menu a { color: #F5F2EB; text-decoration: none; font-size: 15px; transition: color 0.3s; letter-spacing: 1px; }
        .menu a:hover, .menu a.active { color: #DDE8EB; border-bottom: 1px solid #DDE8EB; padding-bottom: 5px; }
        
        /* 手機版漢堡選單設定 */
        .menu-checkbox { display: none; }
        .hamburger-icon { display: none; color: #F5F2EB; font-size: 28px; cursor: pointer; }

        /* 頁面標題區域 */
        .page-header { text-align: center; padding: 60px 20px 40px; }
        .page-title { color: #DDE8EB; font-size: 32px; letter-spacing: 3px; margin-bottom: 10px; font-weight: normal; }
        .page-desc { color: #DDE8EB; font-size: 14px; opacity: 0.7; letter-spacing: 1px; }

        /* 【修改重點2】表單背景：拿掉死板的色塊，改為透明，讓它融入網頁 */
        .form-container { max-width: 600px; margin: 0 auto 80px; padding: 0 40px; background-color: transparent; }
        .form-group { margin-bottom: 40px; position: relative; }
        
        /* 標籤文字：設定為霧灰，帶一點透明度 */
        .form-label { display: block; margin-bottom: 10px; color: #DDE8EB; font-size: 13px; letter-spacing: 1px; opacity: 0.8; }
        
        /* 【修改重點3】輸入框：背景變透明，只留下一條乾淨的底線 */
        .form-input, .form-select, .form-textarea { 
            width: 100%; 
            padding: 10px 0; 
            background-color: transparent; /* 背景透明 */
            border: none; /* 拿掉四周邊框 */
            border-bottom: 1px solid #1B3F43; /* 只留下一條深青綠色的底線 */
            color: #F5F2EB; 
            font-size: 16px; 
            transition: 0.3s; 
            border-radius: 0; /* 確保沒有圓角 */
        }
        
        /* 下拉選單的選項文字顏色 (因為下拉選單的背景會吃系統預設) */
        .form-select option { background-color: #2B2F33; color: #F5F2EB; }

        .form-textarea { height: 100px; resize: none; }
        
        /* 點擊輸入框時：底線會亮起「霧灰」，這就是高級感的細節 */
        .form-input:focus, .form-select:focus, .form-textarea:focus { 
            outline: none; 
            border-bottom: 1px solid #DDE8EB; 
        }
        
        /* 送出按鈕：使用深海藍，乾淨俐落 */
        .submit-btn { width: 100%; padding: 18px; background-color: #203B5F; color: #F5F2EB; border: 1px solid #1B3F43; font-size: 15px; cursor: pointer; transition: 0.3s; letter-spacing: 2px; }
        
        /* 滑鼠移過去按鈕時：亮起霧灰 */
        .submit-btn:hover { background-color: #DDE8EB; color: #203B5F; }

        /* 【新增】照片上傳區塊樣式 */
        .file-upload-box { margin-top: 10px; }
        .file-input { display: none; /* 隱藏原本很醜的預設按鈕 */ }
        .file-label {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 30px; border: 1px dashed #1B3F43; /* 質感虛線邊框 */
            background-color: rgba(32, 59, 95, 0.1); /* 微微的深海藍底色 */
            color: #DDE8EB; cursor: pointer; transition: 0.3s;
        }
        /* 滑鼠移過去時邊框亮起 */
        .file-label:hover { border-color: #DDE8EB; background-color: rgba(32, 59, 95, 0.3); }
        .upload-icon { font-size: 24px; margin-bottom: 8px; }
        .upload-text { font-size: 14px; letter-spacing: 1px; opacity: 0.8; }

        /* 右下角 LINE 客服按鈕 */
        .floating-line { position: fixed; bottom: 30px; right: 30px; background-color: #1B3F43; color: #DDE8EB; padding: 12px 20px; border-radius: 50px; border: 1px solid #DDE8EB; text-decoration: none; font-size: 14px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 9999; display: flex; align-items: center; transition: 0.3s; letter-spacing: 1px; }
        .floating-line:hover { background-color: #DDE8EB; color: #203B5F; }

        /* 手機版排版調整 */
        @media (max-width: 768px) {
            .navbar { padding: 15px 20px; }
            .hamburger-icon { display: block; }
            .menu { display: none; flex-direction: column; position: absolute; top: 68px; left: 0; width: 100%; background-color: #203B5F; padding: 20px 0; border-top: 1px solid #1B3F43; }
            .menu a { padding: 15px; text-align: center; border: none !important; }
            .menu-checkbox:checked ~ .menu { display: flex; }
            .form-container { padding: 0 20px; }
            .floating-line { bottom: 20px; right: 20px; font-size: 13px; padding: 10px 15px; }
        }
        /* --- 聯絡我們懸浮選單樣式 --- */
.contact-menu {
    position: fixed;
    bottom: 30px;
    right: 30px;
    display: flex;
    flex-direction: column-reverse;
    align-items: flex-end;
    gap: 10px;
    z-index: 999;
}
.contact-toggle {
    display: none;
}
.contact-btn {
    background-color: #1B3F43;
    color: #F5F2EB;
    padding: 12px 24px;
    border-radius: 30px;
    text-decoration: none;
    font-weight: bold;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    cursor: pointer;
    transition: 0.3s;
    text-align: center;
}
.contact-btn:hover {
    background-color: #DDE8EB;
    color: #1B3F43;
}
.contact-item {
    background-color: #203B5F;
    color: #F5F2EB;
    padding: 10px 20px;
    border-radius: 20px;
    text-decoration: none;
    font-size: 14px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    opacity: 0;
    visibility: hidden;
    transform: translateY(20px);
    transition: all 0.3s ease;
}
.contact-item:hover {
    background-color: #DDE8EB;
    color: #203B5F;
}
.contact-toggle:checked ~ .contact-item {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
}
    </style>
</head>
<body>

    <!-- 頂部導覽列 -->
    <nav class="navbar">
        <a href="index.html" class="logo">高鑫車業</a>
        <!-- 漢堡選單的隱藏開關 -->
        <input type="checkbox" id="menu-toggle" class="menu-checkbox">
        <label for="menu-toggle" class="hamburger-icon">☰</label>
        <!-- 選單項目 -->
        <div class="menu">
            <a href="index.html">首頁</a>
            <a href="buy.html">嚴選買車</a>
            <a href="sell.html" class="active">線上估車</a>
            <a href="about.html">關於我們</a>
        </div>
    </nav>

    <!-- 頁面標題 -->
    <div class="page-header">
        <h1 class="page-title">TRANSPARENT EVALUATION</h1>
        <p class="page-desc">透明・真實・專業的顧問式估價</p>
    </div>

    <!-- 表單區域 -->
    <div class="form-container">
        <form action="#" method="POST">
            <div class="form-group">
                <label class="form-label">聯絡人姓名</label>
                <!-- placeholder 就是格子裡面的提示文字 -->
                <input type="text" class="form-input" placeholder="請輸入您的姓名" required>
            </div>
            <div class="form-group">
                <label class="form-label">聯絡電話</label>
                <input type="tel" class="form-input" placeholder="例如: 0912345678" required>
            </div>
            <div class="form-group">
                <label class="form-label">車輛廠牌</label>
                <select class="form-select" required>
                    <option value="" disabled selected>請選擇廠牌</option>
                    <option value="Mercedes-Benz">Mercedes-Benz</option>
                    <option value="BMW">BMW</option>
                    <option value="Porsche">Porsche</option>
                    <option value="Audi">Audi</option>
                    <option value="Other">其他</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">車型與出廠年份</label>
                <input type="text" class="form-input" placeholder="例如: 2019 C300" required>
            </div>
            <div class="form-group">
                <label class="form-label">車況備註 (選填)</label>
                <textarea class="form-textarea" placeholder="簡述您的愛車狀況，例如：里程數、有無改裝等..."></textarea>
            </div>
            
            <!-- 【新增】上傳照片區塊 -->
            <div class="form-group">
                <label class="form-label">上傳愛車照片 (外觀與內裝)</label>
                <div class="file-upload-box">
                    <!-- accept="image/*" 限制只能選圖片，multiple 代表可以一次選多張 -->
                    <input type="file" id="car-photos" class="file-input" accept="image/*" multiple>
                    <label for="car-photos" class="file-label">
                        <span class="upload-icon">📷</span>
                        <span class="upload-text">點擊選擇圖片 (支援多張上傳)</span>
                    </label>
                </div>
            </div>

            <!-- 送出按鈕 -->
            <button type="submit" class="submit-btn">送出估車資料</button>
        </form>
    </div>

    <!-- 右下角聯絡我們按鈕 (記得把 href="#" 換成你的 LINE 連結) -->
    <!-- 聯絡我們懸浮選單 -->
<div class="contact-menu">
    <input type="checkbox" id="contact-toggle" class="contact-toggle">
    <label for="contact-toggle" class="contact-btn">💬 聯絡我們</label>
    <a href="tel:0909361360" class="contact-item">📞 撥打電話</a>
    <a href="https://lin.ee/Zubnbww" target="_blank" class="contact-item">💬 官方 LINE</a>
</div>
    

</body>
</html>
